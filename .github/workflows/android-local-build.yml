# بناء APK لأندرويد على رَنر جيتهب بدل سيرفرات EAS.
#
# ليه: حصة البناء في الخطة المجانية 15 بناء أندرويد في الشهر، وبتخلص. الأمر
# `eas build --local` بيبني على الرَنر نفسه، فمبيستهلكش الحصة دي — وده اللي
# بيخلي البناء متاح طول الشهر.
#
# المهم: `--local` لسه بيسحب المفاتيح المُدارة من EAS (التوثيق: "the only
# communication with EAS servers is ... if you are using managed credentials
# to download them"). يعني الـ APK بيتوقّع بنفس كيستور preview، وتسجيل الدخول
# بجوجل بيفضل شغال — وده اللي بيكسر مع أي طريقة بناء محلي تانية.
#
# لينكس مدعوم رسميًا للبناء المحلي، ويندوز لأ — عشان كده ubuntu مش ويندوز.

name: بناء APK على الرَنر

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'بروفايل البناء من eas.json'
        type: choice
        default: preview
        options:
          - preview
          - development
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    # البناء بياخد ~20-30 دقيقة. الحد ده عشان لو علّق ميفضلش ياكل من الدقايق.
    timeout-minutes: 60

    steps:
      # رقم البناء = run_number، وده عدّاد GitHub اللي بيزيد لوحده مع كل
      # تشغيلة. البوابتين دول بيحموه من الحالتين اللي بيتكرر فيهم:
      #   - Re-run: بيعيد نفس run_number، فبناءين مختلفين بنفس versionCode —
      #     وجوجل بلاي بيرفض التاني وإحنا مش عارفين ليه.
      #   - run_number <= 5: الإزاحة بتطرح 5، فأي رقم أقل بيدّي رقم عرض سالب
      #     أو صفر. ده بيحصل لو ملف الورك فلو اتمسح واتعمل من جديد (العدّاد
      #     بيرجع 1) — شوف "رقم البناء" في CLAUDE.md.
      - name: فحص عدّاد البناء
        run: |
          if [ "${{ github.run_attempt }}" != "1" ]; then
            echo "::error::زرار Re-run بيعيد نفس run_number (${{ github.run_number }}) فبيدّي نفس versionCode. شغّل الورك فلو من الأول بدل Re-run."
            exit 1
          fi
          if [ "${{ github.run_number }}" -lt 5 ]; then
            echo "::error::run_number = ${{ github.run_number }} وهو لازم ميقلّش عن 5 (الإزاحة). غالبًا ملف الورك فلو اتعمل من جديد — عدّل RUN_NUMBER_OFFSET في app.config.js."
            exit 1
          fi
          echo "run_number=${{ github.run_number }} · versionCode=${{ github.run_number }}"

      - uses: actions/checkout@v4

      # جافا 17 بالتحديد. الرَنر افتراضيًا 17 دلوقتي، بس لو الافتراضي اتغيّر
      # البناء هيقع برسالة جرادل مش واضحة — فبنثبّتها بدل ما نتفاجأ.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # أكبر توفير وقت. المشروع managed يعني فولدر android بيتولّد من الأول كل
      # مرة، فمن غير الكاش جرادل بيحمّل كل الديبندنسيز من الصفر كل بناء.
      - name: كاش جرادل
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: تثبيت الحزم
        run: npm ci

      - name: بناء APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # الناتج بيتحط هنا بدل ما يترمي في جذر المشروع
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          # app.config.js بيقرا منها versionCode ورقم البناء المعروض
          NUQTA_RUN_NUMBER: ${{ github.run_number }}
          # app.config.js بيحطه في extra.sentryDsn. من غيره Sentry مبتشتغلش
          # خالص في البناء ده — ومفيش أي خطأ بيقول كده (lib/sentry.ts بيرجع بهدوء)
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
        run: eas build --platform android --profile ${{ inputs.profile }} --local --non-interactive

      - name: الناتج
        run: ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: nuqta-${{ inputs.profile }}-${{ github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: error
          # مساحة الأرتيفاكتس في الخطة المجانية 500 ميجا، والـ APK ~88 ميجا —
          # يعني ~5 بناءات بس قبل ما المساحة تتسد وتمنع رفع بناء جديد.
          # 7 أيام كفاية للتحميل والتجربة، وبتفضّي نفسها لوحدها.
          retention-days: 7
          # الـ APK متضغوط أصلاً، فضغطه تاني وقت ضايع
          compression-level: 0
