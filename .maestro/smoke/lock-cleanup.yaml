# تنضيف القفل — بيتنادى من smoke.yaml قبل الطقم (onFlowStart) وبعده
# (onFlowComplete). **onFlowComplete بيشتغل حتى لو خطوة وقعت** — اتأكد على Maestro
# 2.10 بـflow بيقع عن قصد (2026-09-28). مبيشتغلش لو Maestro نفسه اتقفل أو الموبايل
# اتفصل في النص (CLAUDE.md).
#
# **مفيش لينكات هنا خالص** (2026-09-28): والقفل "مع كل رجوع" أي لينك بيقفل التطبيق
# تاني، وبعد الفتح التطبيق بيرجع للرئيسية مش للينك (شاشة القفل بتاخد مكان التطبيق
# كله). فالوصول لإعدادات القفل **بالتابات**: الإعدادات ← قفل التطبيق.
#
# الـPIN الوحيد اللي الطقم بيحطه 2468. آمن يتنادى في أي حالة، وفي الآخر بيتأكد إن
# القفل مقفول (lock_enable_button ظاهر).
appId: host.exp.exponent
---
# 1) شاشة القفل ظاهرة (لوحة أرقام PIN) ← 2468
- runFlow:
    when:
      visible:
        id: lock_forgot_button
    commands:
      - tapOn: "2"
      - tapOn: "4"
      - tapOn: "6"
      - tapOn: "8"
      - extendedWaitUntil:
          notVisible:
            id: lock_forgot_button
          timeout: 15000
# 2) لو مش على شاشة فيها التابات (مودال أو شاشة جوّه) ← رجوع لحد ما التابات تبان
- repeat:
    while:
      notVisible: الإعدادات
    times: 3
    commands:
      - pressKey: Back
      - waitForAnimationToEnd
# 3) الإعدادات ← قفل التطبيق ← إلغاء لو مفعّل
- tapOn: الإعدادات
- tapOn:
    id: settings_row_lock
- runFlow:
    when:
      visible:
        id: lock_disable_button
    commands:
      - tapOn:
          id: lock_disable_button
      - tapOn:
          id: setlock_old_code
      - inputText: "2468"
      - tapOn:
          id: setlock_submit
- extendedWaitUntil:
    visible:
      id: lock_enable_button
    timeout: 15000
