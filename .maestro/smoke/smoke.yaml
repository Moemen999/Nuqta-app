# 2026-09-28، حتى و"Install via USB" مفعّل) قبل أي خطوة — MIUI رفض تثبيت أداة
# Maestro (INSTALL_FAILED_USER_RESTRICTED).
# 2026-09-28 على الـSamsung: 00-reset عدّى، و01 وقع (لينك الجذر ما نقلش من
# dev-seed للرئيسية) — 01 اتصلح (رجوع + المودال). التشغيلة التانية وقعت قبل 01:
# openLink من البارد مبيفتحش Expo Go على الـSamsung (Expo Go تاني في Secure Folder).
# التشغيلة التالتة (من غير إعادة تشغيل): 00 عدّى، و01 وقع في "فئة أ" (الكيبورد
# مغطيها — الـflow ناقصه hideKeyboard). 02 اتعدّل ميقفلش التطبيق وما اشتغلش لسه.
# الرابعة (بـhideKeyboard): وقع في "فئة أ" تاني — النص "🏷️ فئة أ" والمطابقة كاملة؛
# الخامسة (بـ".*فئة أ"): 00 و01 عدّوا كلهم. 02: القفل اشتغل بس بلوحة أرقام PIN
# السادسة (أرقام الـPIN + تنضيف مضمون): 00 و01 وقفل/فتح 02 عدّوا؛ وقع في تنضيف 02
# الجوّاني (اللينك قفل التطبيق تاني)، والتنضيف المضمون لغى القفل. التصليح مستني موافقة. طريقة التشغيل هتتكتب في CLAUDE.md
# بعد أول تشغيل ينجح — مش قبل. حساب الاختبار بس: 00-reset بيقع لو مش هو.
appId: host.exp.exponent
# القفل بيتشال قبل الطقم وبعده — حتى لو خطوة وقعت (lock-cleanup.yaml)
onFlowStart:
  - runFlow: lock-cleanup.yaml
onFlowComplete:
  - runFlow: lock-cleanup.yaml
---
- runFlow: 00-reset.yaml
- runFlow: 01-transaction-balance.yaml
- runFlow: 02-lock-unlock.yaml
