# قفل بـ PIN ← التطبيق يروح الخلفية ويرجع ← شاشة القفل ← الـPIN بيفتح ← الرئيسية.
# إلغاء القفل في lock-cleanup.yaml (من smoke.yaml) — شغّل الطقم من smoke.yaml دايمًا.
#
# **من غير ما يقفل التطبيق ولا يشغّله من الأول** (2026-09-28): على الـSamsung فتح
# exp:// من البارد مبيوصلش لـExpo Go الرئيسي (فيه نسخة تانية في Secure Folder).
# فالقفل بيبقى "مع كل رجوع" (مهلة 0 — الافتراضي) والتطبيق بيروح الخلفية بزرار
# Home ويرجع بنفس اللينك وهو شغّال — ده رجوع مش تشغيل جديد.
# والرئيسية بتتعرف بـhome_hide_amounts_toggle مش "+": كارت "نزل؟" بيخبّيه (01).
appId: host.exp.exponent
---
- openLink: exp://127.0.0.1:8081/--/settings-screens/lock
- tapOn:
    id: lock_enable_button
- tapOn:
    id: setlock_type_pin
- tapOn:
    id: setlock_code1
- inputText: "2468"
- tapOn:
    id: setlock_code2
- inputText: "2468"
- tapOn:
    id: setlock_submit
- extendedWaitUntil:
    visible:
      id: lock_status
    timeout: 10000
- tapOn:
    id: lock_freq_every_resume
- pressKey: Home
- openLink: exp://127.0.0.1:8081/--/
# قفل الـPIN بيظهر **لوحة أرقام** مش خانة (lock_password_input للباسورد بس)،
# والـPIN بيتبعت لوحده بعد 4 أرقام. lock_forgot_button موجود في الحالتين
- extendedWaitUntil:
    visible:
      id: lock_forgot_button
    timeout: 30000
- tapOn: "2"
- tapOn: "4"
- tapOn: "6"
- tapOn: "8"
- extendedWaitUntil:
    notVisible:
      id: lock_forgot_button
    timeout: 20000
# إلغاء القفل مش هنا: فتح لينك إعدادات القفل والتطبيق قدام بيقفله تاني ("مع كل
# رجوع" بمهلة 0) — lock-cleanup.yaml (onFlowComplete في smoke.yaml) بيتعامل مع ده
# وبيلغي القفل ويتأكد، حتى لو خطوة وقعت
