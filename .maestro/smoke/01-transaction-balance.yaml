# عملية مصروف 100 من "تجربة 1" ← رصيدها في الرئيسية بيبقى 5,870.
# التعبئة بتبدأ "تجربة 1" بـ 5,970: 5000 + 3000 − 150 − 200 − 120 − 60 − 500
# (تحويل) − 1000 (سلفة صاحبي أ).
#
# الرجوع للرئيسية **بالتابات** زي المستخدم: لينك تاب التقارير وبعدين دوسة على
# "الرئيسية". مش لينك الجذر (والتطبيق مفتوح مبينقلش — 2026-09-28، الـSamsung)،
# ومش "رجوع" في dev-seed (لو dev-seed اتفتح بارد مفيش تحته حاجة يرجعلها).
#
# التعبئة فيها دخل ثابت معاده النهارده ("نزل؟") وشهر جمعية مستحق ("اتدفع؟"). من
# 2026-09-29 الكروت دي في شيت، والرئيسية فيها سطر واحد "عندك حاجتين مستنيين ردك"،
# والزرار "+" **ظاهر دايمًا** — فالـflow بيتأكد من الاتنين، وبيضيف العملية
# **من الزرار نفسه** زي المستخدم. ومن غير ما يفتح الشيت: "نزل" كان هيزوّد 4,000
# على "تجربة 1" ويبوّظ الرصيد اللي بنختبره.
# (الاشتراك معاده بعد 3 أيام، فمش داخل في العدد.)
# ⏳ التعديل ده ما اتشغّلش لسه على الـSamsung (TIMELINE 2026-09-29).
appId: host.exp.exponent
---
- openLink: exp://127.0.0.1:8081/--/reports
- tapOn: الرئيسية
- extendedWaitUntil:
    visible:
      id: home_hide_amounts_toggle
    timeout: 30000
- assertVisible: "5,970"
- assertVisible:
    id: home_pending_summary
- assertVisible: "عندك حاجتين مستنيين ردك"
- assertNotVisible: ".*نزل؟"
- tapOn:
    id: tx_add_button
- extendedWaitUntil:
    visible:
      id: tx_type_expense
    timeout: 20000
- tapOn:
    id: tx_type_expense
- tapOn:
    id: tx_amount_input
- inputText: "100"
# كيبورد الأرقام بيقصّ الفورم (اتقاس على الـSamsung: الشرايح من y=1251 والفورم
# مقصوص عند 1145)، وMaestro مبيسكرولش لوحده. المستخدم بيوصلها بسحبة واحدة —
# والسحبة بتقفل الكيبورد (keyboardDismissMode) — فده نفس اللي بيحصل للمستخدم
- hideKeyboard
- tapOn: تجربة 1
# اسم الفئة بيتعرض "🏷️ فئة أ" (أيقونة + مسافة مبتتكسرش)، وMaestro بيطابق النص كله
- tapOn: ".*فئة أ"
- tapOn:
    id: tx_save_button
- extendedWaitUntil:
    visible: "5,870"
    timeout: 15000
