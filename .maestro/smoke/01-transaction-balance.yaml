# عملية مصروف 100 من "تجربة 1" ← رصيدها في الرئيسية بيبقى 5,870.
# التعبئة بتبدأ "تجربة 1" بـ 5,970: 5000 + 3000 − 150 − 200 − 120 − 60 − 500
# (تحويل) − 1000 (سلفة صاحبي أ).
#
# الرجوع للرئيسية بـ"رجوع" في dev-seed مش بلينك الجذر: فتح exp://…/--/ والتطبيق
# مفتوح على شاشة تانية ما بينقلش (2026-09-28، الـSamsung). 00-reset بيفتح dev-seed
# فوق الرئيسية، فـ"رجوع" بيرجّعها.
#
# الزرار "+" **مستخبّي** هنا عن قصد: التعبئة فيها دخل ثابت معاده النهارده (كارت
# "نزل؟") وشهر جمعية مستحق (كارت "اتدفع؟")، والزرار بيستخبّى طول ما فيه كارت
# (TIMELINE). فالعملية بتتضاف من مسار المودال نفسه — ومن غير ما نجاوب الكروت:
# "نزل" كان هيزوّد 4,000 على "تجربة 1" ويبوّظ الرصيد اللي بنختبره. والـflow
# **بيتأكد** إن الكروت ظاهرة والزرار مستخبّي، مش بيتجاهلهم.
appId: host.exp.exponent
---
- tapOn: رجوع
- extendedWaitUntil:
    visible:
      id: home_hide_amounts_toggle
    timeout: 30000
- assertVisible: "5,970"
- assertVisible: ".*نزل؟"
- assertVisible: ".*اتدفع؟"
- assertNotVisible:
    id: tx_add_button
- openLink: exp://127.0.0.1:8081/--/modal
- extendedWaitUntil:
    visible:
      id: tx_type_expense
    timeout: 20000
- tapOn:
    id: tx_type_expense
- tapOn:
    id: tx_amount_input
- inputText: "100"
- tapOn: تجربة 1
- tapOn: فئة أ
- tapOn:
    id: tx_save_button
- extendedWaitUntil:
    visible: "5,870"
    timeout: 15000
